name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🔒 Verify pnpm version matches package.json"
        run: |
          EXPECTED=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
          PINNED="10.33.0"
          if [ "$EXPECTED" != "$PINNED" ]; then
            echo "pnpm version mismatch: package.json has $EXPECTED but workflow pins $PINNED"
            exit 1
          fi

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🔍 Type check"
        run: pnpm astro check

      - name: "🚀 Build the project"
        run: pnpm run build
